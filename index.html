<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boggle Solver</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234f46e5'/><stop offset='1' stop-color='%239333ea'/></linearGradient></defs><rect x='4' y='4' width='92' height='92' rx='22' fill='url(%23g)'/><rect x='10' y='10' width='80' height='80' rx='16' fill='white' fill-opacity='0.12'/><text x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial, sans-serif'>B</text></svg>" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar__inner">
        <span class="logo-die" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4f46e5" />
                <stop offset="1" stop-color="#9333ea" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#logo-grad)" />
            <rect x="10" y="10" width="80" height="80" rx="16" fill="white" fill-opacity="0.12" />
            <text x="50" y="72" font-size="62" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">B</text>
          </svg>
        </span>
        <div class="appbar__titles">
          <h1>Boggle Solver</h1>
          <p>Every word on the board, instantly — type it in or snap a photo.</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="card board-card">
        <div class="section-label">Board</div>

        <div class="size-row">
          <label class="field">
            Rows
            <input type="number" id="rows-input" min="3" max="10" value="4" />
          </label>
          <span class="size-x">×</span>
          <label class="field">
            Columns
            <input type="number" id="cols-input" min="3" max="10" value="4" />
          </label>
          <span class="size-hint">3–10</span>
        </div>

        <div class="toolbar">
          <button id="random-btn" class="btn btn--tonal">
            <span class="btn__icon">🎲</span> Shuffle letters
          </button>
          <button id="rich-btn" class="btn btn--tonal" disabled title="Rolls many boards and keeps the one hiding the most long words">
            <span class="btn__icon">🏆</span> Long-word board
          </button>
          <label class="btn btn--tonal file-btn">
            <span class="btn__icon">📷</span> Upload board
            <input type="file" id="image-input" accept="image/*" hidden />
          </label>
          <button id="clear-btn" class="btn btn--tonal">
            <span class="btn__icon">🧹</span> Clear board
          </button>
        </div>

        <p id="ocr-status" class="status-line"></p>

        <div id="board-grid" class="board-grid"></div>

        <div class="solve-row">
          <label class="field">
            Min length
            <select id="min-length-input">
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <button id="solve-btn" class="btn btn--primary btn--big" disabled>
            <span class="btn__icon">🔍</span> Find words
          </button>
        </div>
        <p id="dict-status" class="status-line status-line--center">Loading dictionary…</p>
      </section>

      <section class="card results-card">
        <div class="section-label">Results</div>
        <div class="results-header">
          <h2>Words found</h2>
          <div id="results-summary" class="results-summary"></div>
        </div>
        <div class="results-search">
          <input type="search" id="word-search" placeholder="🔎 Search a word…" autocomplete="off" spellcheck="false" disabled />
        </div>
        <div id="results-list" class="results-list"></div>
      </section>
    </main>

    <footer class="page__footer">
      Word list: <a href="https://github.com/sindresorhus/word-list" target="_blank" rel="noopener">sindresorhus/word-list</a> (MIT).
      OCR: <a href="https://github.com/naptha/tesseract.js" target="_blank" rel="noopener">Tesseract.js</a>. Everything runs in your browser — nothing is uploaded anywhere.
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="js/trie.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
