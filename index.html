<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boggle Solver</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23efe9d8' stroke='%23efe9d8' stroke-width='8' stroke-linejoin='round'><polygon points='50,7 91,27.5 50,48 9,27.5'/><polygon points='9,27.5 50,48 50,91 9,70.5'/><polygon points='50,48 91,27.5 91,70.5 50,91'/></g><polygon points='50,10.3 85.5,28 50,45.7 14.5,28' fill='%23faf6ea' stroke='%23faf6ea' stroke-width='4' stroke-linejoin='round'/><polygon points='12.6,32.3 47.4,49.7 47.4,86.4 12.6,69' fill='%232f6fe4' stroke='%232f6fe4' stroke-width='4' stroke-linejoin='round'/><polygon points='52.6,49.7 87.4,32.3 87.4,69 52.6,86.4' fill='%23d93a3f' stroke='%23d93a3f' stroke-width='4' stroke-linejoin='round'/><text transform='translate(50,28) matrix(0.72,0.36,-0.72,0.36,0,0)' y='9' font-size='26' font-weight='bold' text-anchor='middle' fill='%231e2a5a' font-family='Arial, sans-serif'>A</text><text transform='translate(30,60) matrix(0.89,0.445,0,1,0,0)' y='9' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fdfbf3' font-family='Arial, sans-serif'>B</text><text transform='translate(70,60) matrix(0.89,-0.445,0,1,0,0)' y='9' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fdfbf3' font-family='Arial, sans-serif'>C</text></svg>" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar__inner">
        <span class="logo-die" aria-hidden="true">
          <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g fill="#efe9d8" stroke="#efe9d8" stroke-width="8" stroke-linejoin="round">
              <polygon points="50,7 91,27.5 50,48 9,27.5" />
              <polygon points="9,27.5 50,48 50,91 9,70.5" />
              <polygon points="50,48 91,27.5 91,70.5 50,91" />
            </g>
            <polygon points="50,10.3 85.5,28 50,45.7 14.5,28" fill="#faf6ea" stroke="#faf6ea" stroke-width="4" stroke-linejoin="round" />
            <polygon points="12.6,32.3 47.4,49.7 47.4,86.4 12.6,69" fill="#2f6fe4" stroke="#2f6fe4" stroke-width="4" stroke-linejoin="round" />
            <polygon points="52.6,49.7 87.4,32.3 87.4,69 52.6,86.4" fill="#d93a3f" stroke="#d93a3f" stroke-width="4" stroke-linejoin="round" />
            <text transform="translate(50,28) matrix(0.72,0.36,-0.72,0.36,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e2a5a" font-family="Arial, sans-serif">A</text>
            <text transform="translate(30,60) matrix(0.89,0.445,0,1,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#fdfbf3" font-family="Arial, sans-serif">B</text>
            <text transform="translate(70,60) matrix(0.89,-0.445,0,1,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#fdfbf3" font-family="Arial, sans-serif">C</text>
          </svg>
        </span>
        <div class="appbar__titles">
          <h1>Boggle Solver</h1>
          <p>Every word on the board, instantly — type it in or upload a photo.</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="card board-card">
        <div class="section-label">Board</div>

        <div class="size-row">
          <label class="field">
            Rows
            <input type="number" id="rows-input" min="3" max="10" value="4" />
          </label>
          <span class="size-x">×</span>
          <label class="field">
            Columns
            <input type="number" id="cols-input" min="3" max="10" value="4" />
          </label>
          <span class="size-hint">3–10</span>
          <label class="toggle" title="When on, each box holds two letters: shuffled boards fill with letter pairs and typing takes two letters per box">
            <input type="checkbox" id="two-letter-toggle" />
            2-letter boxes
          </label>
        </div>

        <div class="toolbar">
          <button id="random-btn" class="btn btn--tonal">
            <span class="btn__icon btn__icon--svg" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g fill="#efe9d8" stroke="#efe9d8" stroke-width="8" stroke-linejoin="round">
                  <polygon points="50,7 91,27.5 50,48 9,27.5" />
                  <polygon points="9,27.5 50,48 50,91 9,70.5" />
                  <polygon points="50,48 91,27.5 91,70.5 50,91" />
                </g>
                <polygon points="50,10.3 85.5,28 50,45.7 14.5,28" fill="#faf6ea" stroke="#faf6ea" stroke-width="4" stroke-linejoin="round" />
                <polygon points="12.6,32.3 47.4,49.7 47.4,86.4 12.6,69" fill="#2f6fe4" stroke="#2f6fe4" stroke-width="4" stroke-linejoin="round" />
                <polygon points="52.6,49.7 87.4,32.3 87.4,69 52.6,86.4" fill="#d93a3f" stroke="#d93a3f" stroke-width="4" stroke-linejoin="round" />
                <text transform="translate(50,28) matrix(0.72,0.36,-0.72,0.36,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e2a5a" font-family="Arial, sans-serif">A</text>
                <text transform="translate(30,60) matrix(0.89,0.445,0,1,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#fdfbf3" font-family="Arial, sans-serif">B</text>
                <text transform="translate(70,60) matrix(0.89,-0.445,0,1,0,0)" y="9" font-size="26" font-weight="bold" text-anchor="middle" fill="#fdfbf3" font-family="Arial, sans-serif">C</text>
              </svg>
            </span> Shuffle letters
          </button>
          <button id="rich-btn" class="btn btn--tonal" disabled title="Rolls many boards and keeps the one hiding the most long words">
            <span class="btn__icon">🏆</span> Long-word board
          </button>
          <label class="btn btn--tonal file-btn">
            <span class="btn__icon">📷</span> Upload board
            <input type="file" id="image-input" accept="image/*" hidden />
          </label>
          <button id="clear-btn" class="btn btn--tonal">
            <span class="btn__icon">🧹</span> Clear board
          </button>
        </div>

        <p id="ocr-status" class="status-line"></p>

        <div id="board-grid" class="board-grid"></div>

        <div class="solve-row">
          <label class="field">
            Min length
            <select id="min-length-input">
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <button id="solve-btn" class="btn btn--primary btn--big" disabled>
            <span class="btn__icon">🔍</span> Find words
          </button>
        </div>
        <p id="dict-status" class="status-line status-line--center">Loading dictionary…</p>
      </section>

      <section class="card results-card">
        <div class="section-label">Results</div>
        <div class="results-header">
          <h2>Words found</h2>
          <div id="results-summary" class="results-summary"></div>
        </div>
        <div class="results-controls">
          <input type="search" id="word-search" placeholder="🔎 Search a word…" autocomplete="off" spellcheck="false" disabled />
          <label class="level-field">
            <span>Word level</span>
            <select id="word-level" title="How common words must be to show. Everyday = only very familiar words; All = every valid word including rare ones.">
              <option value="everyday">Everyday</option>
              <option value="common" selected>Common</option>
              <option value="broad">Broad</option>
              <option value="all">All words</option>
            </select>
          </label>
        </div>
        <div id="results-list" class="results-list"></div>
      </section>
    </main>

    <footer class="page__footer">
      Word list: <a href="https://github.com/sindresorhus/word-list" target="_blank" rel="noopener">sindresorhus/word-list</a> (MIT).
      OCR: <a href="https://github.com/naptha/tesseract.js" target="_blank" rel="noopener">Tesseract.js</a>. Everything runs in your browser — nothing is uploaded anywhere.
    </footer>
  </div>

  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="js/trie.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
